[project]
name = "cafeter-ia"
version = "0.1.0"
description = "Cafeter.IA: assistente inteligente para atendimento, pedidos e estoque de cafeterias"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
